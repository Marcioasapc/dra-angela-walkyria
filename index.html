<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dra. Angela Walkyria | Fisioterapeuta</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

        *, *::before, *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: linear-gradient(160deg, #0F1923 0%, #1A2332 50%, #0F1923 100%);
            color: #FFFFFF;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
            position: relative;
            overflow-x: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(ellipse at 30% 20%, rgba(232, 168, 124, 0.04) 0%, transparent 50%),
                        radial-gradient(ellipse at 70% 80%, rgba(75, 163, 154, 0.04) 0%, transparent 50%);
            pointer-events: none;
            z-index: 0;
        }

        .container {
            width: 100%;
            max-width: 480px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 28px;
            position: relative;
            z-index: 1;
        }

        /* Animated Logo — identical to draangelawalkyria.com.br */
        .logo-wrapper {
            width: 120px;
            height: 120px;
            display: flex;
            align-items: center;
            justify-content: center;
            animation: fadeSlideUp 0.6s ease-out both, girando 5s infinite;
        }

        .logo-wrapper svg {
            width: 100%;
            height: 100%;
            fill: #FEB4AB;
            filter: drop-shadow(0 0 20px rgba(254, 180, 171, 0.3));
        }

        @keyframes girando {
            0% { transform: rotate(360deg); }
            50% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Profile info */
        .profile-info {
            text-align: center;
            animation: fadeSlideUp 0.6s ease-out 0.05s both;
        }

        .profile-info h1 {
            font-size: 24px;
            font-weight: 700;
            letter-spacing: -0.3px;
            margin-bottom: 8px;
            background: linear-gradient(135deg, #FFFFFF 0%, #CBD5E1 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .profile-info p {
            font-size: 14px;
            color: rgba(255, 255, 255, 0.55);
            font-weight: 400;
            letter-spacing: 0.2px;
        }

        /* Buttons */
        .buttons {
            display: flex;
            flex-direction: column;
            gap: 14px;
            width: 100%;
        }

        .btn-link {
            display: flex;
            align-items: center;
            width: 100%;
            padding: 16px 20px;
            border-radius: 14px;
            text-decoration: none;
            color: #FFFFFF;
            font-size: 15px;
            font-weight: 500;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.05) 0%, rgba(255, 255, 255, 0.02) 100%);
            border: 1px solid rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
        }

        .btn-link::before {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: 14px;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .btn-link:nth-child(1) { animation: fadeSlideUp 0.6s ease-out 0.1s both; }
        .btn-link:nth-child(2) { animation: fadeSlideUp 0.6s ease-out 0.2s both; }
        .btn-link:nth-child(3) { animation: fadeSlideUp 0.6s ease-out 0.3s both; }
        .btn-link:nth-child(4) { animation: fadeSlideUp 0.6s ease-out 0.4s both; }

        .btn-link:nth-child(1)::before {
            background: linear-gradient(135deg, rgba(75, 163, 154, 0.12) 0%, rgba(75, 163, 154, 0.03) 100%);
        }
        .btn-link:nth-child(2)::before {
            background: linear-gradient(135deg, rgba(232, 168, 124, 0.12) 0%, rgba(232, 168, 124, 0.03) 100%);
        }
        .btn-link:nth-child(3)::before {
            background: linear-gradient(135deg, rgba(245, 158, 11, 0.12) 0%, rgba(245, 158, 11, 0.03) 100%);
        }
        .btn-link:nth-child(4)::before {
            background: linear-gradient(135deg, rgba(148, 187, 211, 0.12) 0%, rgba(148, 187, 211, 0.03) 100%);
        }

        .btn-link:hover {
            transform: translateY(-2px);
            border-color: rgba(255, 255, 255, 0.15);
        }

        .btn-link:nth-child(1):hover {
            border-color: rgba(75, 163, 154, 0.4);
            box-shadow: 0 4px 24px rgba(75, 163, 154, 0.15), 0 0 0 1px rgba(75, 163, 154, 0.1);
        }
        .btn-link:nth-child(2):hover {
            border-color: rgba(232, 168, 124, 0.4);
            box-shadow: 0 4px 24px rgba(232, 168, 124, 0.15), 0 0 0 1px rgba(232, 168, 124, 0.1);
        }
        .btn-link:nth-child(3):hover {
            border-color: rgba(245, 158, 11, 0.4);
            box-shadow: 0 4px 24px rgba(245, 158, 11, 0.15), 0 0 0 1px rgba(245, 158, 11, 0.1);
        }
        .btn-link:nth-child(4):hover {
            border-color: rgba(148, 187, 211, 0.4);
            box-shadow: 0 4px 24px rgba(148, 187, 211, 0.15), 0 0 0 1px rgba(148, 187, 211, 0.1);
        }

        .btn-link:hover::before {
            opacity: 1;
        }

        .btn-link:active {
            transform: translateY(0);
        }

        /* Icon — bigger */
        .btn-icon {
            width: 48px;
            height: 48px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            margin-right: 14px;
            position: relative;
            z-index: 1;
        }

        .btn-link:nth-child(1) .btn-icon {
            background: rgba(75, 163, 154, 0.15);
            color: #4BA39A;
        }
        .btn-link:nth-child(2) .btn-icon {
            background: rgba(232, 168, 124, 0.15);
            color: #E8A87C;
        }
        .btn-link:nth-child(3) .btn-icon {
            background: rgba(245, 158, 11, 0.15);
            color: #F59E0B;
        }
        .btn-link:nth-child(4) .btn-icon {
            background: rgba(148, 187, 211, 0.15);
            color: #94BBD3;
        }

        .btn-icon svg {
            width: 26px;
            height: 26px;
        }

        .btn-text {
            flex: 1;
            position: relative;
            z-index: 1;
        }

        .btn-arrow {
            flex-shrink: 0;
            color: rgba(255, 255, 255, 0.3);
            transition: all 0.3s ease;
            position: relative;
            z-index: 1;
        }

        .btn-link:hover .btn-arrow {
            color: rgba(255, 255, 255, 0.6);
            transform: translateX(3px);
        }

        .btn-arrow svg {
            width: 20px;
            height: 20px;
        }

        /* Footer */
        footer {
            margin-top: 40px;
            text-align: center;
            font-size: 12px;
            color: rgba(255, 255, 255, 0.25);
            letter-spacing: 0.3px;
            animation: fadeSlideUp 0.6s ease-out 0.5s both;
        }

        /* Animations */
        @keyframes fadeSlideUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Responsiveness */
        @media (max-width: 380px) {
            .btn-link {
                padding: 14px 16px;
                font-size: 14px;
            }

            .btn-icon {
                width: 42px;
                height: 42px;
                margin-right: 12px;
            }

            .btn-icon svg {
                width: 22px;
                height: 22px;
            }

            .profile-info h1 {
                font-size: 22px;
            }

            .logo-wrapper {
                width: 100px;
                height: 100px;
            }
        }
    </style>
</head>
